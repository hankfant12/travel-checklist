function render(){let n=items.length,yes=items.filter(x=>x.status==='想去').length,no=items.filter(x=>x.status==='不去').length;$('stats').innerHTML=[['总景点',n],['✓ 想去',yes],['? 待定',n-yes-no],['✕ 不去',no]].map(([k,v])=>`<div class="stat"><b>${v}</b><small>${k}</small></div>`).join('');let q=$('q').value.trim().toLowerCase(),city=$('city').value,st=$('filter').value,lev=$('level').value;let found=items.filter(p=>(!city||p.city===city)&&(!st||p.status===st)&&(!lev||p.recommend===lev)&&(!q||[p.name,p.city,p.tip,p.note].join(' ').toLowerCase().includes(q)));$('list').innerHTML=found.length? [...new Set(found.map(x=>x.city))].map(c=>{let rows=found.filter(x=>x.city===c);return `<div class="sectionhead"><h2>📍 ${esc(c)}</h2><span>${rows.length} 个景点 · ${rows.filter(x=>x.status==='想去').length} 个想去</span></div><div class="panel" style="padding:0;overflow:hidden">`+rows.map(p=>`<div class="item ${p.status==='想去'?'checked':p.status==='不去'?'rejected':''}" data-id="${esc(p.id)}"><input aria-label="勾选想去 ${esc(p.name)}" class="check" type="checkbox" ${p.status==='想去'?'checked':''}><div><a class="name" target="_blank" rel="noopener noreferrer" href="${xhs(p)}">${esc(p.name)} ↗</a><div class="meta"><span class="tag ${p.recommend==='强烈推荐'?'good':p.recommend==='不太推荐'?'low':''}">${esc(p.recommend)}</span><span class="tag">亲子评分 ${p.score}/5</span><span class="tag">🔎 小红书攻略</span></div><div class="tip">${esc(p.tip)}</div><textarea class="note" rows="1" placeholder="夫妻讨论备注：例如排队久、孩子午睡、附近餐厅…">${esc(p.note)}</textarea></div><select class="decision" aria-label="决定 ${esc(p.name)}">${['待定','想去','不去'].map(v=>`<option ${p.status===v?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')+'</div>'}).join(''):'<div class="panel empty">没有符合条件的景点，试试清除筛选。</div>'}
$('list').addEventListener('change',e=>{let row=e.target.closest('[data-id]');if(!row)return;let p=items.find(x=>x.id===row.dataset.id);if(!p)return;if(e.target.matches('.check'))p.status=e.target.checked?'想去':'待定';else if(e.target.matches('.decision'))p.status=e.target.value;else return;save();render()});$('list').addEventListener('input',e=>{if(!e.target.matches('.note'))return;let row=e.target.closest('[data-id]'),p=items.find(x=>x.id===row.dataset.id);if(p){p.note=e.target.value;save()}});['q','city','filter','level'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));
function download(content,name,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('export').onclick=()=>download(JSON.stringify({version:1,exportedAt:new Date().toISOString(),items},null,2),'亲子旅行景点讨论结果.json','application/json');$('csv').onclick=()=>{let head=['城市','景点','选择','推荐','亲子评分','提示','夫妻讨论备注','小红书链接'];let rows=items.map(p=>[p.city,p.name,p.status,p.recommend,p.score,p.tip,p.note,xhs(p)]);let csv='\ufeff'+[head,...rows].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(csv,'亲子旅行景点清单.csv','text/csv;charset=utf-8')};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text()),arr=Array.isArray(obj)?obj:obj.items;if(!Array.isArray(arr)||!arr.every(p=>typeof p.name==='string'&&typeof p.city==='string'&&['待定','想去','不去'].includes(p.status)))throw Error('文件格式不正确');if(confirm('导入将覆盖当前浏览器的选择与备注，确定吗？')){items=arr.map((p,i)=>({id:String(p.id||'import'+i),city:p.city,name:p.name,score:Number(p.score)||3,recommend:p.recommend||'可选',tip:p.tip||'',status:p.status,note:p.note||''}));save();render();alert('导入成功')}}catch(err){alert('导入失败：'+err.message)}e.target.value=''};$('add').onclick=()=>{let name=prompt('新景点名称：');if(!name?.trim())return;let city=prompt('所在城市（香港 / 广州 / 潮州 / 汕头 / 南澳岛 / 其他）：','广州')||'其他';items.push({id:'custom'+Date.now(),city:city.trim(),name:name.trim(),score:3,recommend:'可选',tip:'自定义添加',status:'待定',note:''});save();$('city').value='';$('q').value='';$('filter').value='';$('level').value='';render()};$('reset').onclick=()=>{if(confirm('确定恢复全部初始景点？当前选择、备注和新增景点将被清除。建议先导出备份。')){items=JSON.parse(JSON.stringify(initial));save();render()}};render();
</script></body></html>
